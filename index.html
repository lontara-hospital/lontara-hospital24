var ca="";if(act){ca='<div style="padding:.75rem;display:flex;justify-content:space-between;align-items:center;background:var(--accent3);border-bottom:1px solid var(--border)"><div><p style="font-weight:700;font-size:.9rem">'+esc(act.visitorName)+'</p><p style="font-size:.7rem;color:var(--muted)">Sesi: '+esc(act.createdAt)+'</p></div><div style="display:flex;gap:.5rem"><button data-action="ca-close" data-sid="'+act.id+'" class="btn bw bs"><i class="fas fa-xmark"></i> Tutup Sesi</button><button data-action="ca-del-sess" data-sid="'+act.id+'" class="btn bd bs"><i class="fas fa-trash-can"></i> Hapus</button></div></div><div id="adminChatBody" style="flex:1;overflow-y:auto;padding:.75rem;min-height:340px;max-height:400px">'+act.messages.map(function(m){return '<div class="cm '+(m.sender==="visitor"?"v":"s")+'"><div class="cbl">'+esc(m.text)+'<div class="ct">'+(m.sender==="staff"?"<b>"+esc(m.staffName||"Staff")+"</b> - ":"")+esc(m.time)+"</div></div></div>"}).join("")+"</div>"+(act.messages.length?'<div style="padding:.5rem .75rem;background:var(--bg2);border-top:1px solid var(--border);display:flex;justify-content:flex-end"><button data-action="ca-del-sess" data-sid="'+act.id+'" class="btn bs" style="color:var(--danger);background:none;border:1px solid var(--border)"><i class="fas fa-trash-can"></i> Hapus Riwayat Sesi Ini</button></div>':'')+'<div style="padding:.6rem;border-top:1px solid var(--border);display:flex;gap:.4rem"><input id="adminChatInput" placeholder="Ketik balasan..." style="flex:1;border-radius:2rem;padding:.45rem .75rem;font-size:.82rem"><button data-action="ca-reply" class="btn bp bs" style="border-radius:2rem"><i class="fas fa-paper-plane"></i> Kirim</button></div>'}else{ca='<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:400px"><div style="text-align:center;color:var(--muted)"><i class="fas fa-comments" style="font-size:3rem;margin-bottom:1rem;opacity:.3"></i><p style="font-weight:700">Pilih Sesi Chat</p><p style="font-size:.85rem">Klik sesi di kiri untuk membuka</p></div></div>'}
var mc=document.getElementById("mc");mc.innerHTML='<div class="au"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1.25rem"><div><h2 class="fd" style="font-size:1.25rem;font-weight:700"><i class="fas fa-headset" style="color:var(--accent)"></i> Live Chat</h2><p style="font-size:.75rem;color:var(--muted)">Kelola percakapan - '+esc(U[CU].n)+'</p></div><div style="display:flex;gap:.5rem"><button data-action="ca-print" class="btn bg bs"><i class="fas fa-print"></i> Cetak Log</button>'+(ss.length?'<button data-action="ca-del-all" class="btn bd bs"><i class="fas fa-trash-can"></i> Hapus Semua Riwayat</button>':'')+'</div></div><div class="acc"><div style="overflow-y:auto;max-height:520px" class="gl"><div style="padding:.75rem"><h3 style="font-weight:700;font-size:.85rem;color:var(--accent);margin-bottom:.75rem">Sesi Chat ('+ss.length+')</h3>'+sl+'</div></div><div class="gl" style="display:flex;flex-direction:column">'+ca+'</div></div></div>';setTimeout(function(){var b=document.getElementById("adminChatBody");if(b)b.scrollTop=b.scrollHeight},50)}
function openAC(sid){var ss=gd("chat_sessions");var s=ss.find(function(x){return x.id===sid});if(s){s.messages.forEach(function(m){if(m.sender==="visitor")m.readByAdmin=true});sd("chat_sessions",ss)}CAS=sid;rACPage()}
function sendAR(){var el=document.getElementById("adminChatInput");if(!el||!el.value.trim())return;var msg=el.value.trim();el.value="";var ss=gd("chat_sessions");var s=ss.find(function(x){return x.id===CAS});if(!s)return;var info=U[CU].st[0];s.messages.push({sender:"staff",text:msg,time:nw(),staffName:info.nm+" - "+U[CU].n,readByAdmin:true});sd("chat_sessions",ss);rACPage()}
function closeCS(sid){var ss=gd("chat_sessions");var s=ss.find(function(x){return x.id===sid});if(s){s.status="closed";sd("chat_sessions",ss);toast("Sesi ditutup")}CAS=null;rACPage()}
function delCS(sid){var ss=gd("chat_sessions").filter(function(x){return x.id!==sid});sd("chat_sessions",ss);if(CAS===sid)CAS=null;toast("Riwayat chat dihapus","warn")}
function printCL(){var ss=gd("chat_sessions");var ct=ss.map(function(s){return '<div style="margin-bottom:20px"><h3 style="font-size:13px;border-bottom:1px solid #ccc;padding-bottom:4px">Chat: '+esc(s.visitorName)+" | "+esc(s.createdAt)+" | "+(s.status==="active"?"Aktif":"Selesai")+'</h3><table style="width:100%;font-size:10px;border-collapse:collapse"><thead><tr><th style="border:1px solid #ccc;padding:3px;background:#f0f0f0;width:60px">Waktu</th><th style="border:1px solid #ccc;padding:3px;background:#f0f0f0;width:80px">Pengirim</th><th style="border:1px solid #ccc;padding:3px;background:#f0f0f0">Pesan</th></tr></thead><tbody>'+s.messages.map(function(m){return "<tr><td style=\"border:1px solid #ddd;padding:3px\">"+esc(m.time)+"</td><td style=\"border:1px solid #ddd;padding:3px\">"+esc(m.sender==="visitor"?s.visitorName:(m.staffName||"Staff"))+'</td><td style="border:1px solid #ddd;padding:3px">'+esc(m.text)+"</td></tr>"}).join("")+"</tbody></table></div>"}).join("");var w=window.open("","_blank");w.document.write('<!DOCTYPE html><html><head><title>Log Chat</title><style>body{font-family:Arial;padding:20px;color:#000}h2{font-size:16px;margin:0}p{font-size:11px;color:#555;margin:2px 0}.hdr{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:16px}</style></head><body><div class="hdr"><h2>LONTARA HOSPITAL</h2><p>Log Live Chat - '+esc(U[CU].n)+" | "+nw()+"</p></div>"+ct+"</body></html>");w.document.close();w.print()}
